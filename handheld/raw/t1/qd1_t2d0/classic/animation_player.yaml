animation_cfg:
  action_period_ms: 4   # 每次 Run 累加的伪时间 (ms)，建议与 AnimationPlayer 实际控制周期一致

  default_kp: 30
  default_kd: 1

  # 打断切新动画：只在前 X 比例帧里找与当前姿态最接近的起始帧（避免误匹配到后半段/末帧）
  switch_start_search_ratio: 0.25

planner:
  default_pos: [0.0, 1.57080, 0.52360, 0.0, 1.57080, 0.52360]
  # Idle 稳态下垂限幅（仅 FillIdleJointCommands；homing 规划不使用）
  tau: [0.5, 0.2, 0.5, 0.5, 0.2, 0.5]
  # tau: [1.0, 0.5, 1.0, 1.0, 0.5, 1.0]

  # enter / exit / putdown / preplaying / switch_motion 归位下发 PD（ArmProfile::Planner）
  joints:
    - name: "FL_HIP_ROLL_Joint"
      kp: 4.0
      kd: 0.2
      gravity_scale: 0.6
    - name: "FL_HIP_PITCH_Joint"
      kp: 2.0
      kd: 0.2
      gravity_scale: 0.6
    - name: "FL_KNEE_Joint"
      kp: 4.0
      kd: 0.2
      gravity_scale: 0.6
    - name: "FR_HIP_ROLL_Joint"
      kp: 4.0
      kd: 0.2
      gravity_scale: 0.6
    - name: "FR_HIP_PITCH_Joint"
      kp: 2.0
      kd: 0.2
      gravity_scale: 0.6
    - name: "FR_KNEE_Joint"
      kp: 4.0
      kd: 0.2
      gravity_scale: 0.6

  # 起播 PrePlaying：时长见本段；下发 PD 用 planner.joints（ArmProfile::Planner）
  preplaying:
    enabled: true       # false：ArmHomingPlanner Begin 直接拒绝，不规划
    speed_rad_s:
      roll: 1.0
      pitch: 1.0
      knee: 1.0
    acceleration: 1.0   # rad/s²；与旧 ArmPlanner 一致。<=0 则匀速
    duration_min_s: 0.1
    duration_max_s: 2.0
    dt_ms: 2
    epsilon: 1.0      # Σ(q_meas-setpoint)²，超过则本拍不推进 (rad²)
    tau_min: -3.0       # N·m，下发力矩裁剪下限
    tau_max: 3.0        # N·m，下发力矩裁剪上限
    settle_frames: 300  # 松手重规划后先稳住再推进

  # enter：PreRunOnce / 冷启动阻塞归位；下发 PD 用 planner.joints（ArmProfile::Planner）
  enter:
    enabled: true       # false：ArmHomingPlanner Begin 直接拒绝，不规划
    speed_rad_s:
      roll: 1.0
      pitch: 1.0
      knee: 1.0
    acceleration: 1.0   # rad/s²；抬起/归位，与旧 velocity=1,acceleration=1 对齐
    duration_min_s: 0.2
    duration_max_s: 8.0
    dt_ms: 2
    epsilon: 1.0      # Σ(q_meas-setpoint)²，超过则本拍不推进 (rad²)
    tau_min: -3.0       # N·m，下发力矩裁剪下限
    tau_max: 3.0        # N·m，下发力矩裁剪上限
    settle_frames: 300  # 松手重规划后先稳住再推进

  # putdown：播完/打断回 idle；下发 PD 用 planner.joints（ArmProfile::Planner）
  putdown:
    enabled: true       # false：ArmHomingPlanner Begin 直接拒绝，不规划
    speed_rad_s:
      roll: 1.0
      pitch: 0.8
      knee: 1.0
    acceleration: 0.6   # rad/s²；放下更柔，软 PD(kp≈2~4) 下建议 0.3~0.5
    duration_min_s: 0.1
    duration_max_s: 10.0
    dt_ms: 2
    epsilon: 1.0      # Σ(q_meas-setpoint)²，超过则本拍不推进 (rad²)
    tau_min: -3.0       # N·m，下发力矩裁剪下限
    tau_max: 3.0        # N·m，下发力矩裁剪上限
    settle_frames: 300  # 松手重规划后先稳住再推进

  # switch_motion：打断切新片段；下发 PD 用 planner.joints（ArmProfile::Planner）
  switch_motion:
    enabled: true       # false：ArmHomingPlanner Begin 直接拒绝，不规划
    speed_rad_s:
      roll: 0.8
      pitch: 0.8
      knee: 0.8
    acceleration: 1.0
    duration_min_s: 0.2
    duration_max_s: 4.0
    dt_ms: 2
    epsilon: 1.0      # Σ(q_meas-setpoint)²，超过则本拍不推进 (rad²)
    tau_min: -3.0       # N·m，下发力矩裁剪下限
    tau_max: 3.0        # N·m，下发力矩裁剪上限
    settle_frames: 300  # 松手重规划后先稳住再推进

  # exit：runner 退出归位；下发 PD 用 planner.joints（ArmProfile::Planner）
  exit:
    enabled: true       # false：ArmHomingPlanner Begin 直接拒绝，不规划
    speed_rad_s:
      roll: 1.0
      pitch: 1.0
      knee: 1.0
    acceleration: 1.0
    duration_min_s: 0.1
    duration_max_s: 5.0
    dt_ms: 2
    epsilon: 1.0      # Σ(q_meas-setpoint)²，超过则本拍不推进 (rad²)
    tau_min: -3.0       # N·m，下发力矩裁剪下限
    tau_max: 3.0        # N·m，下发力矩裁剪上限
    settle_frames: 300  # 松手重规划后先稳住再推进

# hold 播放/保持末帧（kp 较高；不做重力补偿）
hold:
  - name: "FL_HIP_ROLL_Joint"
    kp: 30
    kd: 1
    gravity_scale: 1.0
  - name: "FL_HIP_PITCH_Joint"
    kp: 30
    kd: 1
    gravity_scale: 1.0
  - name: "FL_KNEE_Joint"
    kp: 30
    kd: 1
    gravity_scale: 1.0
  - name: "FR_HIP_ROLL_Joint"
    kp: 30
    kd: 1
    gravity_scale: 1.0
  - name: "FR_HIP_PITCH_Joint"
    kp: 30
    kd: 1
    gravity_scale: 1.0
  - name: "FR_KNEE_Joint"
    kp: 30
    kd: 1
    gravity_scale: 1.0

# 柔性动画播放 + preplaying/switch_motion 过渡 PD（GetPlaybackProfile）
animation:
  - name: "FL_HIP_ROLL_Joint"
    kp: 4.0
    kd: 0.5
    gravity_scale: 0.9
  - name: "FL_HIP_PITCH_Joint"
    kp: 2.0
    kd: 0.5
    gravity_scale: 0.9
  - name: "FL_KNEE_Joint"
    kp: 4.0
    kd: 0.5
    gravity_scale: 0.7
  - name: "FR_HIP_ROLL_Joint"
    kp: 4.0
    kd: 0.5
    gravity_scale: 0.9
  - name: "FR_HIP_PITCH_Joint"
    kp: 2.0
    kd: 0.5
    gravity_scale: 0.9
  - name: "FR_KNEE_Joint"
    kp: 4.0
    kd: 0.5
    gravity_scale: 0.7

# 刚性动画播放 + preplaying/switch_motion 过渡 PD（GetPlaybackProfile）
rigid:
  - name: "FL_HIP_ROLL_Joint"
    kp: 15
    kd: 1
    gravity_scale: 1.0
  - name: "FL_HIP_PITCH_Joint"
    kp: 15
    kd: 1
    gravity_scale: 1.0
  - name: "FL_KNEE_Joint"
    kp: 15
    kd: 1
    gravity_scale: 1.0
  - name: "FR_HIP_ROLL_Joint"
    kp: 15
    kd: 1
    gravity_scale: 1.0
  - name: "FR_HIP_PITCH_Joint"
    kp: 15
    kd: 1
    gravity_scale: 1.0
  - name: "FR_KNEE_Joint"
    kp: 15
    kd: 1
    gravity_scale: 1.0

# idle 静止下垂；tau_g 缩放见各关节 gravity_scale
idle:
  - name: "FL_HIP_ROLL_Joint"
    kp: 4.0
    kd: 0.2
    gravity_scale: 0.6
  - name: "FL_HIP_PITCH_Joint"
    kp: 2.0
    kd: 0.2
    gravity_scale: 0.75
  - name: "FL_KNEE_Joint"
    kp: 4.0
    kd: 0.2
    gravity_scale: 0.6
  - name: "FR_HIP_ROLL_Joint"
    kp: 4.0
    kd: 0.2
    gravity_scale: 0.6
  - name: "FR_HIP_PITCH_Joint"
    kp: 2.0
    kd: 0.2
    gravity_scale: 0.75
  - name: "FR_KNEE_Joint"
    kp: 4.0
    kd: 0.2
    gravity_scale: 0.6

# 默认动画帧率（未在 ani_table 指定 fps 时使用）
default_fps: 100.0

# 重力补偿：按动作类型独立开关（不再使用全局 enable/scale）
gravity_comp:
  - mode: animation
    enable: true
  - mode: rigid
    enable: false
  - mode: hold
    enable: false
  - mode: idle
    enable: true
  - mode: planner
    enable: true   # 取消归位段开启重力补偿，避免大臂支撑力矩一拍掉到0导致顿挫

# tau = clip(kp·(q*-q) − kd·dq, ±clip_tau) + tau_g；clip_tau 仅约束 PD 项
# 只限制跟踪误差产生的纠偏力矩 (N·m)；重力前馈 tau_g 不受此限、始终全额叠加
# 关节摩擦力 用于补偿
gravity_friction:
  - name: "FL_HIP_ROLL_Joint"
    friction: 0.0001
  - name: "FL_HIP_PITCH_Joint"
    friction: 0.0001
  - name: "FL_KNEE_Joint"
    friction: 0.2
  - name: "FR_HIP_ROLL_Joint"
    friction: 0.0001
  - name: "FR_HIP_PITCH_Joint"
    friction: 0.0001
  - name: "FR_KNEE_Joint"
    friction: 0.2

# PD 跟踪力矩上限 (N·m)；重力项在限幅后叠加（与 Q1 一致）
clip_tau:
  FL_HIP_ROLL_Joint: 1.0
  FL_HIP_PITCH_Joint: 1.0
  FL_KNEE_Joint: 1.5
  FR_HIP_ROLL_Joint: 1.0
  FR_HIP_PITCH_Joint: 1.0
  FR_KNEE_Joint: 1.5
  default: 1.0

# 个别动作大臂 pitch 需更高刚度以举到位/复位到位
animation_overrides:
  - animation_id: 2017            # 骄傲：大臂 pitch 提刚度，消除顶点举不满 + 底端复位滞后
    joints:
      - name: "FL_HIP_PITCH_Joint"
        kp: 7.0
        kd: 1.0
        gravity_scale: 1.0
      - name: "FR_HIP_PITCH_Joint"
        kp: 7.0
        kd: 1.0
        gravity_scale: 1.0

