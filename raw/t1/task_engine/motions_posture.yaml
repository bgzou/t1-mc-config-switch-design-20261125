  - animation_id: 4001  # MODE_INDOORS  室内模式
    min_post_process_signal: 53
    animation_name: "mode_indoors"
    animation_name_zh: "室内模式"
    motion_name_code: 1895
    motion_list_type: ["bipedal", "quadrupedal"]
