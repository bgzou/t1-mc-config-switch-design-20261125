      env:
        LOG_PATH: /robot/persist/log/drp

    "rc":
      path: "/robot/software/rc/bin/em_run.sh"
      sudo: false
      # stdout: "/tmp/rc.log"
      stderr: "/tmp/rc.err"
      env:
        LOG_PATH: /robot/persist/log/rc

    "mc":
      path: "/robot/software/mc/bin/em_run.sh"
      sudo: false
      # stdout: "/tmp/mc.log"
