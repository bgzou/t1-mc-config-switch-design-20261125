common_rules:
  # 允许所有action切换到指定的action
  allow_all_switch_to:
    - PASSIVE_DEFAULT
    - DAMPING_DEFAULT
    - QUAD_LIE_DOWN
  allow_switch_to_all: []

  # 设置需要跳过的action
  skip_actions:
    - PASSIVE_DEFAULT
    - BIPED_LOCOMOTION_WBC
    - BIPED_LOCOMOTION_ANIMATION
    # - BIPED_LOCOMOTION_WBCDANCE
    - BIPED_MIMIC
    - BIPED_LINGCHUANG_MIMIC
    - BIPED_GIMBAL
    - BIPED_NPZ_MIMIC
    - BIPED_STAND_DEFAULT
    - QUADRUPED_RECOVERY
    # - QUADRUPED_TO_BIPED_FRONTFLIP
    # - BIPED_TO_QUADRUPED_FRONTFLIP
    - QUADRUPED_LOCOMOTION_FRONTFLIP
    - QUADRUPED_LOCOMOTION_BACKFLIP
    - QUADRUPED_GET_DOWN_DEFAULT
    - STORE_DEFAULT
    - QUADRUPED_SIT_DOWN_DEFAULT
    - BIPED_TO_QUADRUPED
    - QUADRUPED_TO_BIPED
    - BIPED_RECOVERY
    - QUADRUPED_LOCOMOTION_DEFAULT
    - QUADRUPED_LOCOMOTION_TERRAIN
    - QUADRUPED_LOCOMOTION_RUN
    - QUADRUPED_LOCOMOTION_HANDSHAKE
    - QUADRUPED_LOCOMOTION_JUMP
    - QUADRUPED_STAND_REVERSE_DEFAULT
    - QUADRUPED_LOCOMOTION_REVERSE_DEFAULT
    
action_rules:
  PASSIVE_DEFAULT:
    next_actions:
      - QUADRUPED_READY_STAND_DEFAULT  # mid action
      - QUADRUPED_SIT_DOWN_DEFAULT
      - QUADRUPED_GET_DOWN_DEFAULT
      - STORE_DEFAULT
      - QUADRUPED_RECOVERY
      - QUADRUPED_CROUCH_DEFAULT
      - BIPED_STAND_DEFAULT
      - BIPED_RECOVERY
  
  QUADRUPED_READY_STAND_DEFAULT:    # 四足准备站立
    next_actions:
      - QUADRUPED_STAND_DEFAULT

  QUADRUPED_STAND_REVERSE_DEFAULT:  # 四足前肢手臂反轴站立
    next_actions:
      - QUADRUPED_STAND_DEFAULT       # 回正常站立
      - QUADRUPED_LOCOMOTION_REVERSE_DEFAULT    # 四足反向行走模式

  QUADRUPED_LOCOMOTION_REVERSE_DEFAULT: # 四足反向行走模式
    next_actions:
      - QUADRUPED_STAND_DEFAULT
      - QUADRUPED_STAND_REVERSE_DEFAULT

  QUADRUPED_BODY_ADJUST_DEFAULT:   # 四肢身体调整
    next_actions:
      - QUADRUPED_STAND_DEFAULT
      - QUADRUPED_LOCOMOTION_DEFAULT  # 四足行走
      - QUADRUPED_LOCOMOTION_TERRAIN  # 四足越野
      - QUADRUPED_LOCOMOTION_RUN      # 四足奔跑

  QUADRUPED_CROUCH_DEFAULT: 
    next_actions:
      - PASSIVE_DEFAULT
      - QUADRUPED_READY_STAND_DEFAULT

  DAMPING_DEFAULT:
    next_actions:
      - PASSIVE_DEFAULT
  
  QUAD_LIE_DOWN:
    next_actions:
      - PASSIVE_DEFAULT

  QUADRUPED_STAND_DEFAULT:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT # 四足行走
      - QUADRUPED_LOCOMOTION_TERRAIN # 四足越野
      - QUADRUPED_LOCOMOTION_RUN     # 四足奔跑
      - STORE_DEFAULT                # 四足存储
      # - QUADRUPED_LOCOMOTION_PLEASURE # 四足愉快
      - QUADRUPED_LOCOMOTION_STEP    # 四足踏步(进入gated动作前的稳定闸门)
      - QUADRUPED_GET_DOWN_DEFAULT

  QUADRUPED_GET_DOWN_DEFAULT:  # 四足趴下
    next_actions:
      - QUADRUPED_READY_STAND_DEFAULT
      - QUADRUPED_SIT_DOWN_DEFAULT
      - QUADRUPED_LOCOMOTION_HANDSHAKE
  
  QUADRUPED_SIT_DOWN_DEFAULT:  # 四足坐下
    next_actions:
      - QUADRUPED_GET_DOWN_DEFAULT
      - STORE_DEFAULT
      - QUADRUPED_STAND_DEFAULT
      - QUADRUPED_LOCOMOTION_HANDSHAKE

  QUADRUPED_LOCOMOTION_DEFAULT:  # 四足行走
    next_actions:
      - QUADRUPED_LOCOMOTION_STEP
      - STORE_DEFAULT
      - QUADRUPED_TO_BIPED
      - QUADRUPED_TO_BIPED_ROTATE
      - QUADRUPED_GET_DOWN_DEFAULT
      # - QUADRUPED_TO_BIPED_FRONTFLIP      

# 四足步伐
  QUADRUPED_LOCOMOTION_STEP:
    next_actions:
      # gated 目标：踏步稳定(ExitCheck 放行)后才进入
      - QUADRUPED_LOCOMOTION_STRETCH
      - QUADRUPED_LOCOMOTION_DANCE
      - QUADRUPED_PUSH_UP
      - QUADRUPED_LOCOMOTION_PRIDE
      - QUADRUPED_LOCOMOTION_BIONIC
      # - QUADRUPED_GET_DOWN_DEFAULT
      - QUADRUPED_SIT_DOWN_DEFAULT
      - QUADRUPED_MIMIC
      # - QUADRUPED_TO_BIPED
      # - QUADRUPED_TO_BIPED_ROTATE
      # - QUADRUPED_TO_BIPED_FRONTFLIP
      - QUADRUPED_LOCOMOTION_FRONTFLIP
      - QUADRUPED_LOCOMOTION_BACKFLIP
      - QUADRUPED_LOCOMOTION_PLEASURE
      # 归宿态
      - QUADRUPED_STAND_DEFAULT
      - QUADRUPED_STAND_REVERSE_DEFAULT # 四足前肢手臂反轴站立
      - QUADRUPED_BODY_ADJUST_DEFAULT   # 四足姿态调整
      - STORE_DEFAULT
      - QUADRUPED_LOCOMOTION_HANDSHAKE
      - QUADRUPED_LOCOMOTION_JUMP # 四足跳跃
      - QUADRUPED_LOCOMOTION_TERRAIN
      - QUADRUPED_LOCOMOTION_RUN
      - QUADRUPED_LOCOMOTION_DEFAULT


# 四足室外模式
  QUADRUPED_LOCOMOTION_RUN:
    next_actions:
      - QUADRUPED_LOCOMOTION_STEP
      - STORE_DEFAULT
      - QUADRUPED_TO_BIPED
      - QUADRUPED_TO_BIPED_ROTATE
      - QUADRUPED_GET_DOWN_DEFAULT
      # - QUADRUPED_TO_BIPED_FRONTFLIP      

# 四足超能模式 越野模式
  QUADRUPED_LOCOMOTION_TERRAIN:
    next_actions:
      - QUADRUPED_LOCOMOTION_STEP
      - STORE_DEFAULT
      - QUADRUPED_TO_BIPED
      - QUADRUPED_TO_BIPED_ROTATE
      - QUADRUPED_GET_DOWN_DEFAULT
      # - QUADRUPED_TO_BIPED_FRONTFLIP

# 四足仿生
  QUADRUPED_LOCOMOTION_BIONIC:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_LOCOMOTION_TERRAIN
      - QUADRUPED_LOCOMOTION_RUN

# 四足骄傲
  QUADRUPED_LOCOMOTION_PRIDE:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      # - QUADRUPED_LOCOMOTION_PLEASURE

# 四足推胸
  QUADRUPED_PUSH_UP:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_STAND_DEFAULT

# 四足模仿
  QUADRUPED_MIMIC:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_LOCOMOTION_TERRAIN
      - QUADRUPED_LOCOMOTION_RUN
      - QUADRUPED_STAND_DEFAULT

# 四足愉快
  QUADRUPED_LOCOMOTION_PLEASURE:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_LOCOMOTION_STEP

# 四足跳跃
  QUADRUPED_LOCOMOTION_JUMP:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_STAND_DEFAULT
  
# 四足握手
  QUADRUPED_LOCOMOTION_HANDSHAKE:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_STAND_DEFAULT
      - QUADRUPED_SIT_DOWN_DEFAULT

# 四足恢复模式 腹部朝地
  QUADRUPED_RECOVERY:
    next_actions:
      - QUADRUPED_LOCOMOTION_STEP   # 退出后先踏步稳定，再由 STEP 路由到 STAND 等归宿
      - STORE_DEFAULT

# 四足伸展
  QUADRUPED_LOCOMOTION_STRETCH:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_STAND_DEFAULT
  
# 四足舞蹈
  QUADRUPED_LOCOMOTION_DANCE:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_STAND_DEFAULT
  
# 双足站立模式
  BIPED_STAND_DEFAULT:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION
      # - BIPED_LOCOMOTION_TERRAIN
      # - BIPED_TO_QUADRUPED

# 双足恢复模式
  BIPED_RECOVERY:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION
      # - BIPED_LOCOMOTION_TERRAIN
      # - BIPED_TO_QUADRUPED
# 双足全身控制模式 / 双足室内模式
  BIPED_LOCOMOTION_WBC:
    next_actions:
      # - BIPED_STAND_DEFAULT
      - BIPED_TO_QUADRUPED
      # - BIPED_TO_QUADRUPED_FRONTFLIP
      - BIPED_TO_QUADRUPED_ROTATE
      - BIPED_LOCOMOTION_TERRAIN
      - BIPED_LOCOMOTION_RUN 
      - BIPED_LOCOMOTION_DEFAULT
      - BIPED_LOCOMOTION_ROTATE_LOCAL
      - BIPED_LOCOMOTION_BACKBEND
      - BIPED_YUZURU
      - BIPED_SPLIT
      - BIPED_LOCOMOTION_MOONWALK
      - BIPED_LOCOMOTION_DANCE
      - BIPED_LOCOMOTION_ANIMATION
      # - BIPED_LOCOMOTION_WBCDANCE
      - BIPED_MIMIC
      - BIPED_LINGCHUANG_MIMIC
      - BIPED_GIMBAL
      - BIPED_NPZ_MIMIC
      - BIPED_RECORD_UPPER
      - BIPED_CUSTOM_UPPER


  # BIPED_LOCOMOTION_WBCDANCE:
  #   next_actions:
  #     - BIPED_LOCOMOTION_WBC

  BIPED_RECORD_UPPER:
    next_actions:
      # - BIPED_STAND_DEFAULT
      - BIPED_LOCOMOTION_WBC

# 双足上肢模仿（从 WBC 切入；可 SetMcAction 打断，出口与 ANIMATION 对齐）
  BIPED_MIMIC:
    next_actions:
      - BIPED_TO_QUADRUPED
      # - BIPED_TO_QUADRUPED_FRONTFLIP
      - BIPED_TO_QUADRUPED_ROTATE
      - BIPED_LOCOMOTION_TERRAIN
      - BIPED_LOCOMOTION_RUN
      - BIPED_LOCOMOTION_DEFAULT
      - BIPED_LOCOMOTION_ROTATE_LOCAL
      - BIPED_LOCOMOTION_BACKBEND
      - BIPED_YUZURU
      - BIPED_SPLIT
      - BIPED_LOCOMOTION_MOONWALK
      - BIPED_LOCOMOTION_WBC
      - BIPED_LOCOMOTION_ANIMATION

# 双足灵创模仿（轨迹内嵌 onnx；可 SetMcAction 打断）
  BIPED_LINGCHUANG_MIMIC:
    next_actions:
      - BIPED_TO_QUADRUPED
      # - BIPED_TO_QUADRUPED_FRONTFLIP
      - BIPED_TO_QUADRUPED_ROTATE
      - BIPED_LOCOMOTION_TERRAIN
      - BIPED_LOCOMOTION_RUN
      - BIPED_LOCOMOTION_DEFAULT
      - BIPED_LOCOMOTION_ROTATE_LOCAL
      - BIPED_LOCOMOTION_BACKBEND
      - BIPED_YUZURU
      - BIPED_SPLIT
      - BIPED_LOCOMOTION_MOONWALK
      - BIPED_LOCOMOTION_WBC
      - BIPED_LOCOMOTION_ANIMATION

# 双足 gimbal（从 WBC 切入；可 SetMcAction 打断，出口回 WBC）
  BIPED_GIMBAL:
    next_actions:
      - BIPED_TO_QUADRUPED
      # - BIPED_TO_QUADRUPED_FRONTFLIP
      - BIPED_TO_QUADRUPED_ROTATE
      - BIPED_LOCOMOTION_TERRAIN
      - BIPED_LOCOMOTION_RUN
      - BIPED_LOCOMOTION_DEFAULT
      - BIPED_LOCOMOTION_ROTATE_LOCAL
      - BIPED_LOCOMOTION_BACKBEND
      - BIPED_YUZURU
      - BIPED_SPLIT
      - BIPED_LOCOMOTION_MOONWALK
      - BIPED_LOCOMOTION_WBC
      - BIPED_LOCOMOTION_ANIMATION
        
# 双足 npz 模仿（onnx 策略 + npz 参考轨迹；可 SetMcAction 打断）
  BIPED_NPZ_MIMIC:
    next_actions:
      - BIPED_TO_QUADRUPED
      # - BIPED_TO_QUADRUPED_FRONTFLIP
      - BIPED_TO_QUADRUPED_ROTATE
      - BIPED_LOCOMOTION_TERRAIN
      - BIPED_LOCOMOTION_RUN
      - BIPED_LOCOMOTION_DEFAULT
      - BIPED_LOCOMOTION_ROTATE_LOCAL
      - BIPED_LOCOMOTION_BACKBEND
      - BIPED_YUZURU
      - BIPED_SPLIT
      - BIPED_LOCOMOTION_MOONWALK
      - BIPED_LOCOMOTION_WBC
      - BIPED_LOCOMOTION_ANIMATION

# 双足动画模式
  BIPED_LOCOMOTION_ANIMATION:
    next_actions:
      # - BIPED_STAND_DEFAULT
      - BIPED_TO_QUADRUPED
      # - BIPED_TO_QUADRUPED_FRONTFLIP
      - BIPED_TO_QUADRUPED_ROTATE
      - BIPED_LOCOMOTION_TERRAIN
      - BIPED_LOCOMOTION_RUN 
      - BIPED_LOCOMOTION_DEFAULT
      - BIPED_LOCOMOTION_ROTATE_LOCAL
      - BIPED_LOCOMOTION_BACKBEND
      - BIPED_YUZURU
      - BIPED_SPLIT
      - BIPED_LOCOMOTION_MOONWALK
      - BIPED_LOCOMOTION_WBC

# 双足超能模式
  BIPED_LOCOMOTION_RUN:
    next_actions:
      # - BIPED_STAND_DEFAULT
      - BIPED_LOCOMOTION_WBC
      - BIPED_TO_QUADRUPED_ROTATE
      # - BIPED_LOCOMOTION_ANIMATION

# 双足越野模式
  BIPED_LOCOMOTION_TERRAIN:
    next_actions:
      # - BIPED_STAND_DEFAULT
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION

# 双足羽生结弦
  BIPED_YUZURU:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION

# 双足批叉
  BIPED_SPLIT:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION

# 双足室外模式
  BIPED_LOCOMOTION_DEFAULT:
    next_actions:
      - BIPED_LOCOMOTION_TERRAIN
      - BIPED_LOCOMOTION_WBC
      - BIPED_LOCOMOTION_RUN

      # - BIPED_LOCOMOTION_ANIMATION
# 四足到双足
  QUADRUPED_TO_BIPED:
    next_actions:
      # - BIPED_STAND_DEFAULT
      - BIPED_LOCOMOTION_WBC
      - BIPED_LOCOMOTION_TERRAIN
      # - BIPED_LOCOMOTION_ANIMATION
      # - BIPED_TO_QUADRUPED
# 四足旋转变双足
  QUADRUPED_TO_BIPED_ROTATE:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION
      - BIPED_LOCOMOTION_TERRAIN

# 双足变四足
  BIPED_TO_QUADRUPED:
    next_actions:
      - QUADRUPED_STAND_DEFAULT
      - QUADRUPED_LOCOMOTION_DEFAULT
      - QUADRUPED_LOCOMOTION_TERRAIN
  
# 双足前空翻变四足
  BIPED_TO_QUADRUPED_FRONTFLIP:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT

# 双足旋转变四足
  BIPED_TO_QUADRUPED_ROTATE:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
  
# 四足前空翻
  QUADRUPED_LOCOMOTION_FRONTFLIP:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
  
# 四足后空翻
  QUADRUPED_LOCOMOTION_BACKFLIP:
    next_actions:
      - QUADRUPED_LOCOMOTION_DEFAULT
  
# 四足前空翻变双足
  QUADRUPED_TO_BIPED_FRONTFLIP:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION

# 双足旋转
  BIPED_LOCOMOTION_ROTATE_LOCAL:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION

# 双足后弯
  BIPED_LOCOMOTION_BACKBEND:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      # - BIPED_LOCOMOTION_ANIMATION

# 双足太空漫步
  BIPED_LOCOMOTION_MOONWALK:
    next_actions:
      - BIPED_LOCOMOTION_WBC
      - BIPED_LOCOMOTION_RUN
      # - BIPED_LOCOMOTION_ANIMATION

  BIPED_LOCOMOTION_DANCE:
    next_actions:
      - BIPED_LOCOMOTION_WBC


  BIPED_CUSTOM_UPPER:
    next_actions:
      - BIPED_LOCOMOTION_WBC
  # TEST ACTION
  # TEST_PLATFORM:
  #   next_actions:
  #     - PASSIVE_DEFAULT

  # TEST_FOURIER:
  #   next_actions:
  #     - PASSIVE_DEFAULT
