    kp: 100.0
    kd: 1.5
  - name: "FL_HIP_PITCH_Joint"
    kp: 150.0
    kd: 1.5
  - name: "FL_KNEE_Joint"
    kp: 150.0
    kd: 1.5
  - name: "FR_HIP_ROLL_Joint"
    kp: 100.0
    kd: 1.5
  - name: "FR_HIP_PITCH_Joint"
    kp: 150.0
    kd: 1.5
  - name: "FR_KNEE_Joint"
    kp: 150.0
    kd: 1.5
  - name: "RL_HIP_ROLL_Joint"
    kp: 100.0
    kd: 1.5
  - name: "RL_HIP_PITCH_Joint"
    kp: 250.0
    kd: 1.5
  - name: "RL_KNEE_Joint"
    kp: 250.0
    kd: 1.5
  - name: "RL_FOOT_Joint"
    kp: 0.0
